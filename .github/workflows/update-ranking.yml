name: Update QDII ranking

on:
  schedule:
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Run a clean-history refresh, tests and diagnostics without publishing or email'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: qdii-ranking-production
  cancel-in-progress: false

env:
  CI: "true"
  PYTHONUNBUFFERED: "1"
  OUTPUT_DIR: output/qdii-ranking
  VALUATION_OUTPUT_DIR: output/index-valuation
  PUBLISH_DIR: public
  PAGE_BASE_URL: https://qdii-ranking-web-run-cool-d2gy0iw957219659c.webapps.tcloudbase.com/
  TCB_OWNER_APP_ID: "1432808015"

jobs:
  update-publish-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Record job start
        shell: bash
        run: echo "JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Validate required secrets
        if: ${{ inputs.verify_only != true }}
        id: configuration
        shell: bash
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          missing=()
          for name in QQ_SMTP_USER QQ_SMTP_AUTH_CODE TCB_SECRET_ID TCB_SECRET_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Restore ranking cache
        uses: actions/cache@v6
        with:
          path: output/qdii-ranking/cache
          key: qdii-ranking-${{ runner.os }}-${{ hashFiles('scripts/update_qdii_ranking.py', 'scripts/qdii_ranking/**', 'scripts/qdii_validation/**', 'scripts/premium_refresh.js', 'functions/qdii-premium-api/*.js', 'references/premium-service.json', 'scripts/update_index_valuation.py', 'scripts/index_valuation/**', 'scripts/valuation_page.js', 'references/index-valuation-catalog.json', 'references/us-equity-instruments.json', 'references/us-equity-etfs.json', 'references/contract-benchmarks.json') }}-${{ github.run_id }}
          restore-keys: |
            qdii-ranking-${{ runner.os }}-${{ hashFiles('scripts/update_qdii_ranking.py', 'scripts/qdii_ranking/**', 'scripts/qdii_validation/**', 'scripts/premium_refresh.js', 'functions/qdii-premium-api/*.js', 'references/premium-service.json', 'scripts/update_index_valuation.py', 'scripts/index_valuation/**', 'scripts/valuation_page.js', 'references/index-valuation-catalog.json', 'references/us-equity-instruments.json', 'references/us-equity-etfs.json', 'references/contract-benchmarks.json') }}-
            qdii-ranking-${{ runner.os }}-

      - name: Verify clean-history startup
        if: ${{ inputs.verify_only == true }}
        run: |
          test ! -f "$OUTPUT_DIR/latest.json"
          test -f references/ranking-baseline.json

      - name: Install Python dependencies
        id: dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts

      - name: Refresh ranking
        id: update
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "Ranking refresh attempt ${attempt}/2"
            if python scripts/update_qdii_ranking.py \
              --output-dir "$OUTPUT_DIR" \
              --publish-dir "$PUBLISH_DIR"; then
              exit 0
            fi
            if [[ "$attempt" == "1" ]]; then
              echo "Refresh failed; retrying in 120 seconds"
              sleep 120
            fi
          done
          exit 1

      - name: Read ranking date
        id: ranking_date
        shell: bash
        run: |
          RUN_DATE=$(python -c "import json; print(json.load(open('$OUTPUT_DIR/latest.json', encoding='utf-8'))['run_date'])")
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          echo "PAGE_URL=${PAGE_BASE_URL}?v=${RUN_DATE}" >> "$GITHUB_ENV"
          echo "VALUATION_URL=${PAGE_BASE_URL}valuation/?v=${RUN_DATE}" >> "$GITHUB_ENV"

      - name: Refresh index valuation
        id: valuation_update
        run: >-
          python scripts/update_index_valuation.py
          --output-dir "$VALUATION_OUTPUT_DIR"
          --publish-dir "$PUBLISH_DIR"
          --cache-dir "$OUTPUT_DIR/cache/index-valuation"
          --as-of "$RUN_DATE"

      - name: Validate generated artifacts
        id: validation
        run: |
          python scripts/validate_qdii_ranking.py \
            --output-dir "$OUTPUT_DIR" \
            --publish-dir "$PUBLISH_DIR" \
            --expected-date "$RUN_DATE"
          python scripts/validate_index_valuation.py \
            --output-dir "$VALUATION_OUTPUT_DIR" \
            --publish-dir "$PUBLISH_DIR" \
            --expected-date "$RUN_DATE"

      - name: Run unit tests
        id: tests
        run: |
          python tests/run_python.py
          node --test tests/js/test_premium_refresh.mjs
          node --test tests/js/test_premium_service.mjs
          node --test tests/js/test_valuation_page.mjs

      - name: Install CloudBase CLI
        if: ${{ inputs.verify_only != true }}
        id: cloudbase_cli
        run: npm install --global @cloudbase/cli@3.7.3

      - name: Log in to CloudBase
        if: ${{ inputs.verify_only != true }}
        id: cloudbase_login
        shell: bash
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          account_output=$(tcb api cam GetUserAppId --api-version 2019-01-16 --json 2>&1)
          account_app_id=$(printf '%s' "$account_output" | python -c 'import json, sys; text=sys.stdin.read(); start=text.find("{"); data=json.JSONDecoder().raw_decode(text[start:])[0]; print(data["data"]["AppId"])')
          if [[ "$account_app_id" != "$TCB_OWNER_APP_ID" ]]; then
            echo "::error::TCB credentials belong to AppID ${account_app_id}; expected ${TCB_OWNER_APP_ID} for run-cool-d2gy0iw957219659c"
            exit 1
          fi
          echo "Verified CloudBase account AppID ${account_app_id}"

      - name: Prepare premium service package
        if: ${{ inputs.verify_only != true }}
        run: python scripts/prepare_premium_function.py

      - name: Deploy and verify premium service
        if: ${{ inputs.verify_only != true }}
        id: premium_service
        shell: bash
        run: |
          tcb fn deploy qdii-premium-api --env-id run-cool-d2gy0iw957219659c --httpFn --dir tmp/premium-function --force --json
          tcb routes edit --env-id run-cool-d2gy0iw957219659c --data "$(cat references/premium-route.json)" --yes --json
          tcb permission get collection:qdii_premium_cache --env-id run-cool-d2gy0iw957219659c --json > /tmp/premium-permission.json
          python -c 'import json; p=json.load(open("/tmp/premium-permission.json")); assert p["data"]["PermissionList"][0]["Permission"] == "ADMINONLY"'
          python scripts/validate_premium_service.py --require-live --output output/qdii-ranking/premium-service-check.json

      - name: Promote validated ranking baseline
        if: ${{ inputs.verify_only != true }}
        run: python scripts/promote_ranking_baseline.py

      - name: Commit generated page
        if: ${{ inputs.verify_only != true }}
        id: git_publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/index.html public/valuation/index.html public/premium-snapshot.json references/ranking-baseline.json
          if git diff --cached --quiet; then
            echo "Generated page is unchanged; no commit needed"
          else
            git commit -m "chore: update QDII ranking for ${RUN_DATE}"
            git push origin HEAD:main
          fi

      - name: Deploy static application
        if: ${{ inputs.verify_only != true }}
        id: deployment
        shell: bash
        working-directory: public
        run: |
          deploy_log=$(mktemp)
          trap 'rm -f "$deploy_log"' EXIT
          tcb app deploy qdii-ranking-web \
            --env-id run-cool-d2gy0iw957219659c \
            --framework static \
            --output-dir . \
            --deploy-path /qdii \
            --cwd . \
            --install-command= \
            --build-command= \
            --force \
            --yes \
            --json > >(tee "$deploy_log") 2>&1 &
          deploy_pid=$!

          for second in {1..180}; do
            if grep -Fq '"totalDuration":' "$deploy_log" && \
               grep -Fq '"url": "https://qdii-ranking-web-run-cool-d2gy0iw957219659c.webapps.tcloudbase.com/' "$deploy_log"; then
              if kill -0 "$deploy_pid" 2>/dev/null; then
                kill "$deploy_pid" 2>/dev/null || true
                wait "$deploy_pid" 2>/dev/null || true
                echo "CloudBase deploy reported success; stopped the residual CLI process"
              else
                wait "$deploy_pid"
              fi
              exit 0
            fi

            if ! kill -0 "$deploy_pid" 2>/dev/null; then
              set +e
              wait "$deploy_pid"
              deploy_status=$?
              set -e
              exit "$deploy_status"
            fi
            sleep 1
          done

          kill "$deploy_pid" 2>/dev/null || true
          wait "$deploy_pid" 2>/dev/null || true
          echo "::error::CloudBase deploy did not finish within 3 minutes"
          exit 1

      - name: Verify deployed page
        if: ${{ inputs.verify_only != true }}
        id: deployed_validation
        shell: bash
        run: |
          VERIFY_URL="${PAGE_URL}&run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/validate_qdii_ranking.py \
            --output-dir "$OUTPUT_DIR" \
            --publish-dir "$PUBLISH_DIR" \
            --expected-date "$RUN_DATE" \
            --deployed-url "$VERIFY_URL" \
            --attempts 18 \
            --delay-seconds 10
          VALUATION_VERIFY_URL="${VALUATION_URL}&run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/validate_index_valuation.py \
            --output-dir "$VALUATION_OUTPUT_DIR" \
            --publish-dir "$PUBLISH_DIR" \
            --expected-date "$RUN_DATE" \
            --deployed-url "$VALUATION_VERIFY_URL" \
            --attempts 18 \
            --delay-seconds 10

      - name: Send success email
        if: ${{ inputs.verify_only != true }}
        id: success_notification
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          QQ_MAIL_TO: ${{ secrets.QQ_MAIL_TO }}
        run: >-
          python scripts/send_qdii_email.py
          --status success
          --data "$OUTPUT_DIR/latest.json"
          --url "$PAGE_URL"

      - name: Report performance comparison
        if: ${{ success() }}
        continue-on-error: true
        run: >-
          python scripts/report_update_metrics.py
          --baseline references/performance-baseline.json
          --current "$OUTPUT_DIR/run-metrics.json"
          --job-started-epoch "$JOB_STARTED_EPOCH"

      - name: Send failure email
        if: ${{ failure() && inputs.verify_only != true }}
        continue-on-error: true
        shell: bash
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          QQ_MAIL_TO: ${{ secrets.QQ_MAIL_TO }}
          CONFIGURATION_OUTCOME: ${{ steps.configuration.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          VALUATION_UPDATE_OUTCOME: ${{ steps.valuation_update.outcome }}
          DATE_OUTCOME: ${{ steps.ranking_date.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          GIT_OUTCOME: ${{ steps.git_publish.outcome }}
          CLI_OUTCOME: ${{ steps.cloudbase_cli.outcome }}
          LOGIN_OUTCOME: ${{ steps.cloudbase_login.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PREMIUM_OUTCOME: ${{ steps.premium_service.outcome }}
          REMOTE_OUTCOME: ${{ steps.deployed_validation.outcome }}
          SUCCESS_MAIL_OUTCOME: ${{ steps.success_notification.outcome }}
        run: |
          outcomes="configuration=${CONFIGURATION_OUTCOME}, dependencies=${DEPENDENCIES_OUTCOME}, update=${UPDATE_OUTCOME}, valuation=${VALUATION_UPDATE_OUTCOME}, date=${DATE_OUTCOME}, validation=${VALIDATION_OUTCOME}, tests=${TESTS_OUTCOME}, git=${GIT_OUTCOME}, cli=${CLI_OUTCOME}, login=${LOGIN_OUTCOME}, deploy=${DEPLOY_OUTCOME}, remote=${REMOTE_OUTCOME}, success_email=${SUCCESS_MAIL_OUTCOME}"
          stage="unknown"
          for item in \
            "configuration:${CONFIGURATION_OUTCOME}" \
            "dependencies:${DEPENDENCIES_OUTCOME}" \
            "refresh:${UPDATE_OUTCOME}" \
            "valuation-refresh:${VALUATION_UPDATE_OUTCOME}" \
            "ranking-date:${DATE_OUTCOME}" \
            "validation:${VALIDATION_OUTCOME}" \
            "tests:${TESTS_OUTCOME}" \
            "git-push:${GIT_OUTCOME}" \
            "cloudbase-cli:${CLI_OUTCOME}" \
            "cloudbase-login:${LOGIN_OUTCOME}" \
            "premium-service:${PREMIUM_OUTCOME}" \
            "deployment:${DEPLOY_OUTCOME}" \
            "remote-validation:${REMOTE_OUTCOME}" \
            "success-email:${SUCCESS_MAIL_OUTCOME}"; do
            if [[ "${item#*:}" == "failure" ]]; then
              stage="${item%%:*}"
              break
            fi
          done
          publication_state="not-published"
          if [[ "${GIT_OUTCOME}" == "success" ]]; then
            publication_state="repository-updated"
          fi
          if [[ "${DEPLOY_OUTCOME}" == "success" ]]; then
            publication_state="deployment-unverified"
          fi
          if [[ "${REMOTE_OUTCOME}" == "success" ]]; then
            publication_state="published"
          fi
          args=(
            --status failure
            --failure-stage "$stage"
            --failure-detail "$outcomes"
            --publication-state "$publication_state"
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )
          if [[ -n "${RUN_DATE:-}" ]]; then
            args+=(--date "$RUN_DATE")
          fi
          python3 scripts/send_qdii_email.py "${args[@]}"

      - name: Archive ranking diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ranking-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            output/qdii-ranking/candidate-audit.json
            output/qdii-ranking/premium-snapshot.json
            output/qdii-ranking/premium-service-check.json
            output/qdii-ranking/cache/quota-notices/*.json
            output/qdii-ranking/run-metrics.json
            output/qdii-ranking/latest.*
            output/qdii-ranking/ranking-changes.md
            output/index-valuation/latest.json
            output/index-valuation/run-metrics.json

      - name: Summarize failed candidate assessment
        if: ${{ failure() }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("output/qdii-ranking/candidate-audit.json")
          if path.exists():
              audit = json.loads(path.read_text(encoding="utf-8"))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  print("Ranking assessment failed:", audit.get("error"), file=out)
                  for item in audit["records"]:
                      if item["status"] == "blocked":
                          print(item["code"], item["stage"], item.get("label"), file=out)
          PY
